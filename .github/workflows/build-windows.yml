name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build SoundpackMaker.exe
        run: >-
          pyinstaller --clean --noconfirm --onefile --windowed
          --name SoundpackMaker
          --icon assets/SoundpackMaker.ico
          --add-data "assets/SoundpackMaker.ico;assets"
          --paths .
          main.py

      - name: Verify executable contents
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/SoundpackMaker.exe")) {
            throw "PyInstaller did not produce dist/SoundpackMaker.exe"
          }
          $size = (Get-Item "dist/SoundpackMaker.exe").Length
          if ($size -lt 1000000) {
            throw "Executable is unexpectedly small: $size bytes"
          }
          Write-Host "Built SoundpackMaker.exe ($size bytes)"

      - name: Package Windows release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          Compress-Archive -Path "dist/SoundpackMaker.exe" -DestinationPath "dist/SoundpackMaker-$version-Windows.zip"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundpackMaker-Windows
          path: dist/SoundpackMaker.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Soundpack Maker ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/SoundpackMaker-${{ github.ref_name }}-Windows.zip
